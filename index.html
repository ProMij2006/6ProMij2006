<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор стоимости услуги</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow border-0 rounded-4 p-4">
                    <h2 class="card-title text-center mb-4 text-primary fw-bold">Калькулятор заказа</h2>

                    <form id="calcForm" onsubmit="return false;">
                        
                        <div class="mb-3">
                            <label for="quantityInput" class="form-label fw-semibold">Количество:</label>
                            <input type="text" id="quantityInput" class="form-control" value="1">
                            <div id="error" class="invalid-feedback"></div>
                        </div>

                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Тип услуги:</label>
                            <div class="d-flex flex-column gap-2">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="serviceType" id="type1" value="1" checked>
                                    <label class="form-check-label" for="type1">Базовый (без опций) — 1 000 руб.</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="serviceType" id="type2" value="2">
                                    <label class="form-check-label" for="type2">Стандарт (с опцией) — 2 000 руб.</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="serviceType" id="type3" value="3">
                                    <label class="form-check-label" for="type3">Премиум (со свойством) — 3 000 руб.</label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3" id="selectContainer" style="display: none;">
                            <label for="productSelect" class="form-label fw-semibold">Опция товара:</label>
                            <select id="productSelect" class="form-select">
                                <option value="500">Электронная лицензия (+500 руб.)</option>
                                <option value="1200">Расширенная гарантия (+1 200 руб.)</option>
                                <option value="2000">VIP-поддержка (+2 000 руб.)</option>
                            </select>
                        </div>

                        <div class="mb-3" id="checkboxContainer" style="display: none;">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="propertyCheckbox" value="1500">
                                <label class="form-check-label fw-semibold" for="propertyCheckbox">
                                    Срочное выполнение (+1 500 руб.)
                                </label>
                            </div>
                        </div>

                        <button type="submit" id="calcBtn" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                            Подтвердить выбор
                        </button>
                    </form>

                    <div id="result" class="mt-4 fw-bold text-success text-center fs-5"></div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
